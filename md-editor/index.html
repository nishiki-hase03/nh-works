<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>md Editor by NH Works</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- Diagram Support: Mermaid & PlantUML Encoder -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script src="https://unpkg.com/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header>
            <h1>md Editor</h1>
            <div class="header-actions">
                <div class="file-operations">
                    <button id="btn-open-folder" title="フォルダを開く">📁 <span>Open Folder</span></button>
                    <button id="btn-toggle-sidebar" class="hidden" title="サイドバーの開閉">🗂️ <span>Toggle
                            Sidebar</span></button>
                    <button id="btn-open" title="ファイルを開く (Ctrl+O)">📂 <span>Open File</span></button>
                    <button id="btn-save" title="上書き保存 (Ctrl+S)">💾 <span>Save</span></button>
                    <button id="btn-save-as" title="別名で保存">💾 <span>Save As</span></button>
                    <span id="current-filename" title="現在のファイル名">Untitled.md</span>
                </div>
                <button id="btn-undo" title="Undo (Ctrl+Z)" disabled><span>Undo</span></button>
                <button id="btn-redo" title="Redo (Ctrl+Y)" disabled><span>Redo</span></button>
                <button id="btn-refresh" title="Refresh Preview"><span>Refresh</span></button>
                <div class="toggle-group">
                    <label class="toggle-switch" title="見出しの下線を切り替え">
                        <input type="checkbox" id="toggle-underline">
                        <span class="slider"></span>
                        <span class="label-text">Underline</span>
                    </label>
                    <label class="toggle-switch" title="目次の表示を切り替え">
                        <input type="checkbox" id="toggle-toc" checked>
                        <span class="slider"></span>
                        <span class="label-text">TOC</span>
                    </label>
                </div>
                <div class="view-modes" title="表示モード切替"
                    style="display: flex; gap: 4px; border: 1px solid var(--border-color); border-radius: 6px; padding: 2px;">
                    <button id="btn-view-editor" class="mini-btn" title="エディタのみ表示">📝</button>
                    <button id="btn-view-split" class="mini-btn active" title="分割表示 (デフォルト)">🌓</button>
                    <button id="btn-view-preview" class="mini-btn" title="プレビューのみ表示">👁️</button>
                </div>
                <button id="btn-theme" title="Toggle Light/Dark Mode">🌙</button>
                <span id="sync-status">Synced</span>
            </div>
        </header>

        <div class="workspace-layout">
            <!-- Sidebar: File Explorer -->
            <aside id="file-explorer" class="sidebar hidden">
                <div class="sidebar-header">
                    <span>Explorer</span>
                    <button id="btn-close-folder" class="mini-btn" title="フォルダを閉じる">✖️</button>
                </div>
                <ul id="file-tree" class="file-tree"></ul>
            </aside>
            <div id="explorer-resizer" class="resizer hidden"></div>

            <!-- Main Editor Area -->
            <div class="main-content">
                <div class="app-tabs">
                    <button class="tab-item active" data-tab="edit">編集・プレビュー</button>
                    <button class="tab-item" data-tab="diff">テキスト差分</button>
                </div>
                <main id="tab-edit" class="tab-content active">
                    <div class="editor-pane">
                        <div class="pane-header">
                            <span>Source</span>
                            <div class="pane-actions">
                                <button id="btn-copy" class="mini-btn">Copy</button>
                                <button id="btn-set-before" class="mini-btn">変更前に反映</button>
                                <button id="btn-set-after" class="mini-btn">変更後に反映</button>
                            </div>
                        </div>
                        <div class="editor-wrapper">
                            <div id="line-numbers" class="line-numbers"></div>
                            <textarea id="markdown-input" spellcheck="false" placeholder="Markdownを入力..."></textarea>
                        </div>
                    </div>
                    <div id="pane-resizer" class="resizer"></div>
                    <div class="preview-pane">
                        <div class="pane-header">
                            <span>Preview</span>
                            <span id="preview-path"
                                style="margin-left: 10px; font-size: 0.8em; color: var(--text-secondary); font-weight: normal; opacity: 0.8;"></span>
                        </div>
                        <div class="preview-layout">
                            <div id="preview-output" class="markdown-body"></div>
                            <aside id="toc-container" class="toc-sidebar">
                                <div class="toc-header">目次</div>
                                <nav id="toc-content"></nav>
                            </aside>
                        </div>
                    </div>
                </main>
                <main id="tab-diff" class="tab-content">
                    <div class="diff-container">
                        <div class="pane-header">Text Difference (Before vs After)</div>
                        <div id="diff-output" class="diff-body"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <div id="context-menu" class="context-menu" style="display: none;">
        <ul>
            <li id="menu-add-row-above">行を上に挿入</li>
            <li id="menu-add-row-below">行を下に挿入</li>
            <li id="menu-delete-row">行を削除</li>
            <li class="menu-separator"></li>
            <li id="menu-add-col-left">列を左に挿入</li>
            <li id="menu-add-col-right">列を右に挿入</li>
            <li id="menu-delete-col">列を削除</li>
        </ul>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('ServiceWorker registration successful:', registration.scope);
                }).catch(err => {
                    console.log('ServiceWorker registration failed:', err);
                });
            });
        }
    </script>
</body>

</html>
